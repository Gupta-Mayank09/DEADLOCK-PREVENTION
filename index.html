<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deadlock Prevention Simulator</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

    <h1 class="title">Deadlock Prevention Simulator</h1>

    <!-- CONTROL -->
    <div class="panel glass">
        <h2>Controls</h2>
        <div class="buttons">
            <button onclick="call('/start')">Start</button>
            <button onclick="call('/stop')">Stop</button>
            <button onclick="call('/reset')">Reset</button>
        </div>
    </div>

    <!-- STEPS -->
    <div class="panel glass">
        <h2>Simulation Steps</h2>
        <div class="buttons">
            <button onclick="call('/step1')">P1 → R1</button>
            <button onclick="call('/step2')">P2 → R2</button>
            <button onclick="call('/step3')">P1 requests R2</button>
            <button onclick="call('/step4')">P2 requests R1</button>
        </div>
    </div>

    <!-- STATUS -->
    <div class="panel glass status-box">
        <h2>Status</h2>

        <button class="check-btn" onclick="call('/status')">
            Check Deadlock
        </button>

        <p id="status" class="status-text">Click "Check Deadlock"</p>
    </div>

    <!-- PREVENTION -->
    <div class="panel glass">
        <h2>Prevention Techniques</h2>
        <div class="buttons">
            <button onclick="apply('/prevent/mutual','Mutual Exclusion Broken')">Mutual Exclusion</button>
            <button onclick="apply('/prevent/holdwait','Hold & Wait Broken')">Hold & Wait</button>
            <button onclick="apply('/prevent/preemption','No Preemption Broken')">No Preemption</button>
            <button onclick="apply('/prevent/circular','Circular Wait Broken')">Circular Wait</button>
        </div>
    </div>

    <!-- EXPLANATION -->
    <div class="panel glass">
        <h2>Explanation</h2>
        <p id="explanation">Click a prevention technique to see explanation</p>
    </div>

    <!-- GRAPH -->
    <div class="panel glass">
        <h2>Graph</h2>
        <button onclick="call('/graph')">Show Graph</button>
    </div>

</div>

<script src="/static/script.js"></script>
<script src="/static/bg.js"></script>

</body>
</html>
